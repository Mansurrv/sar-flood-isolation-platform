<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">SAR Flood Isolation Platform — system architecture</title>
  <desc id="desc">The user works through a React interface and FastAPI service. SAR processing uses Sentinel-1 data from Google Earth Engine and threshold methods to create flood masks. Road and settlement data from OpenStreetMap feed an isolation analysis that returns flood extents and isolated settlements.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#526579"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #172b3a; }
      .title { font-size: 24px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 600; }
      .sub { font-size: 13px; fill: #43596b; }
      .box { stroke: #38566d; stroke-width: 2; rx: 12; }
      .arrow { fill: none; stroke: #526579; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="560" fill="#f7fafc"/>
  <text x="40" y="48" class="title">SAR Flood Isolation Platform — System Architecture</text>

  <rect x="40" y="125" width="180" height="82" class="box" fill="#e5f2ff"/>
  <text x="130" y="158" text-anchor="middle" class="label">Analyst / planner</text>
  <text x="130" y="181" text-anchor="middle" class="sub">Select event and view results</text>

  <rect x="300" y="125" width="190" height="82" class="box" fill="#e8f5e9"/>
  <text x="395" y="158" text-anchor="middle" class="label">React map interface</text>
  <text x="395" y="181" text-anchor="middle" class="sub">Map, controls, result layers</text>

  <rect x="570" y="125" width="180" height="82" class="box" fill="#fff3d6"/>
  <text x="660" y="158" text-anchor="middle" class="label">FastAPI service</text>
  <text x="660" y="181" text-anchor="middle" class="sub">Request and result endpoints</text>

  <rect x="830" y="85" width="245" height="82" class="box" fill="#eee8ff"/>
  <text x="952" y="118" text-anchor="middle" class="label">SAR processing</text>
  <text x="952" y="141" text-anchor="middle" class="sub">Sentinel-1 / Google Earth Engine</text>

  <rect x="830" y="215" width="245" height="82" class="box" fill="#fff0e6"/>
  <text x="952" y="248" text-anchor="middle" class="label">Threshold methods</text>
  <text x="952" y="271" text-anchor="middle" class="sub">Create candidate flood masks</text>

  <rect x="570" y="365" width="230" height="82" class="box" fill="#e0f4f2"/>
  <text x="685" y="398" text-anchor="middle" class="label">Isolation analysis</text>
  <text x="685" y="421" text-anchor="middle" class="sub">Assess road access to settlements</text>

  <rect x="270" y="365" width="230" height="82" class="box" fill="#f1f3f5"/>
  <text x="385" y="398" text-anchor="middle" class="label">OpenStreetMap</text>
  <text x="385" y="421" text-anchor="middle" class="sub">Roads and settlement locations</text>

  <rect x="870" y="365" width="205" height="82" class="box" fill="#e5f2ff"/>
  <text x="972" y="398" text-anchor="middle" class="label">Results</text>
  <text x="972" y="421" text-anchor="middle" class="sub">Flood extent + isolated places</text>

  <path d="M220 166 H300" class="arrow"/>
  <path d="M490 166 H570" class="arrow"/>
  <path d="M750 145 H790 V126 H830" class="arrow"/>
  <path d="M952 167 V215" class="arrow"/>
  <path d="M830 256 H785 V406 H800" class="arrow"/>
  <path d="M500 406 H570" class="arrow"/>
  <path d="M800 406 H870" class="arrow"/>
  <path d="M972 365 V330 H660 V207" class="arrow"/>
  <path d="M570 187 H530 V238 H395 V207" class="arrow"/>
</svg>
